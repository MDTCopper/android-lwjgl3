name: Build LWJGL natives for Android

# Manual only: pushing must not start a build.
#
# One dispatch builds every ABI in parallel, then publishes one stable-named
# archive per ABI to a GitHub release named after the LWJGL version.
#
# The Android NDK is fetched as a standalone zip instead of going through
# android-actions/setup-android + sdkmanager: the setup-android action still
# tries to install the long-removed legacy "tools" package and fails with
# "Failed to find package 'tools'". A plain zip also pins the exact revision.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the per-ABI archives to the GitHub release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Keep these in sync with scripts/common.sh.
  ANDROID_API: "30"
  NDK_VERSION: "29.0.14206865"
  NDK_RELEASE: "r29"

jobs:
  build:
    name: "Build ${{ matrix.abi }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: ["arm64-v8a", "armeabi-v7a", "x86_64"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt -y install autoconf automake libtool zip unzip

      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_HOME="$RUNNER_TEMP/android-ndk-${NDK_RELEASE}"
          if [ ! -d "$NDK_HOME" ]; then
            curl -fL --retry 3 -o "$RUNNER_TEMP/ndk.zip" \
              "https://dl.google.com/android/repository/android-ndk-${NDK_RELEASE}-linux.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
            rm -f "$RUNNER_TEMP/ndk.zip"
          fi
          # The runner image also ships an NDK of a *different* revision, so
          # prove that the one we are about to build with is the pinned one.
          grep -q "^Pkg.Revision = ${NDK_VERSION}$" "$NDK_HOME/source.properties" || {
            echo "::error::$NDK_HOME is not NDK ${NDK_VERSION}"
            exit 1
          }
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "using $NDK_HOME"
          "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Build natives
        run: ./scripts/build.sh --abi "${{ matrix.abi }}" --outdir dist

      - name: Package archive
        run: ./scripts/package.sh --abi "${{ matrix.abi }}" --indir dist --outdir release

      - name: Collect build information
        run: cp dist/BUILD-INFO.txt "release/BUILD-INFO-${{ matrix.abi }}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: natives-${{ matrix.abi }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    name: "Publish release"
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all ABI artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          # only the artifacts of this run, never a stale build
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/*.zip release/
          cd release
          sha256sum ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Compose release notes
        run: |
          set -euo pipefail
          source scripts/common.sh

          {
            echo "Native **LWJGL ${LWJGL_VERSION}** libraries for **Android**, compiled from upstream source."
            echo
            echo "## Components"
            echo
            echo "| Component | Version | Revision |"
            echo "| --- | --- | --- |"
            echo "| LWJGL | ${LWJGL_VERSION} | [\`${LWJGL_COMMIT:0:12}\`](https://github.com/LWJGL/lwjgl3/commit/${LWJGL_COMMIT}) |"
            echo "| libffi | ${LIBFFI_VERSION} | [\`${LIBFFI_COMMIT:0:12}\`](https://github.com/libffi/libffi/commit/${LIBFFI_COMMIT}) |"
            echo "| Android NDK | ${NDK_VERSION} (${NDK_RELEASE}) | Google release |"
            echo "| Android API level (minSdk) | ${ANDROID_API} (Android 11) | |"
            echo "| Architectures | $(IFS=', '; echo "${ALL_ABIS[*]}") | |"
            echo
            echo "LWJGL modules built: \`lwjgl\` (core, includes EGL bindings) and \`lwjgl-opengles\`."
            echo
            echo "## Downloads"
            echo
            echo "| ABI | Archive | Resource path |"
            echo "| --- | --- | --- |"
            for abi in "${ALL_ABIS[@]}"; do
              echo "| ${abi} | \`lwjgl-${LWJGL_VERSION}-android-${abi}.zip\` | \`linux/$(abi_lwjgl_arch "$abi")/org/lwjgl/\` |"
            done
            echo
            echo "Each archive contains the \`linux/<arch>/org/lwjgl/\` resource tree and can be extracted as-is into a Java project's resources."
            echo
            echo "Verify with \`SHA256SUMS.txt\` (attached)."
            echo
            echo "## Build configuration"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Compiler | Android NDK ${NDK_RELEASE} clang (LLVM) |"
            echo "| Optimization | \`-O3\` |"
            echo "| Debug info | retained (DWARF), libraries are **not** stripped |"
            echo "| Linker version script | none - all symbols are exported |"
            echo "| Excluded sources | \`linux/UIO.c\`, \`linux/liburing/*\` (kernel-only) |"
            echo "| Runtime deps | \`libc\`, \`libdl\`, \`libm\` (bionic) only |"
            echo
            echo "<details><summary>Per-ABI build information</summary>"
            echo
            for f in artifacts/BUILD-INFO-*.txt; do
              echo '```text'
              cat "$f"
              echo '```'
              echo
            done
            echo "</details>"
            echo
            echo "## Not included"
            echo
            echo "ANGLE (\`libEGL_angle.so\`, \`libGLESv2_angle.so\`, \`libGLESv1_CM_angle.so\`) is **not** part of these archives: those are Android platform prebuilts and must be supplied separately under \`linux/<arch>/\`."
          } > release-notes.md

          cat release-notes.md

      - name: Publish to the GitHub release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/common.sh

          TAG="$LWJGL_VERSION"
          TITLE="$LWJGL_VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --latest --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$TAG" --latest --target "$GITHUB_REF_NAME" \
              --title "$TITLE" --notes-file release-notes.md
          fi

          gh release upload "$TAG" release/*.zip release/SHA256SUMS.txt --clobber

          echo "--- assets on the $TAG release ---"
          gh release view "$TAG" --json tagName,assets --jq '.tagName, (.assets[].name)'
