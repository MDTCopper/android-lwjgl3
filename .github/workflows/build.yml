name: Build Android natives

# Builds the LWJGL 3.4.1 native libraries (core + OpenGL ES) for Android from
# source with a pinned NDK, then publishes one archive per ABI on a GitHub
# Release named after the LWJGL version.
#
#   workflow_dispatch  -> optional release (default: publish)
#   push to a tag 3.*  -> publish a release for that tag
#   push to main       -> build + upload workflow artifacts only (validation)

on:
  workflow_dispatch:
    inputs:
      lwjgl_version:
        description: "LWJGL version to build; must match a commit pinned in scripts/common.sh"
        default: "3.4.1"
        required: true
      publish_release:
        description: "Create / update the GitHub Release"
        type: boolean
        default: true
  push:
    branches: [main, master]
    tags: ["3.*"]

permissions:
  contents: write

concurrency:
  group: natives-${{ github.ref }}
  cancel-in-progress: false

env:
  LWJGL_VERSION: ${{ github.event.inputs.lwjgl_version || '3.4.1' }}
  ANDROID_API: "30"
  NDK_VERSION: "29.0.14206865"

jobs:
  # ---------------------------------------------------------------------------
  # One job per ABI, all in parallel.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK (required by sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool zip

      - name: Show toolchain
        run: |
          set -x
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls "${ANDROID_SDK_ROOT}/ndk"
          "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Build natives
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh --abi "${{ matrix.abi }}" --outdir dist

      - name: Package archive
        run: ./scripts/package.sh --abi "${{ matrix.abi }}" --indir dist --outdir release

      - name: Collect build info
        run: cp "dist/BUILD-INFO.txt" "release/BUILD-INFO-${{ matrix.abi }}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.abi }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Collect every ABI, checksum the archives and publish the release.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all ABI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: ls -l artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/*.zip release/
          cd release
          sha256sum ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Compose release notes
        run: |
          set -euo pipefail
          source scripts/common.sh

          {
            echo "Native **LWJGL ${LWJGL_VERSION}** libraries for **Android**, compiled from upstream source."
            echo
            echo "## Components"
            echo
            echo "| Component | Version | Revision |"
            echo "| --- | --- | --- |"
            echo "| LWJGL | ${LWJGL_VERSION} | [\`${LWJGL_COMMIT:0:12}\`](https://github.com/LWJGL/lwjgl3/commit/${LWJGL_COMMIT}) |"
            echo "| libffi | ${LIBFFI_VERSION} | [\`${LIBFFI_COMMIT:0:12}\`](https://github.com/libffi/libffi/commit/${LIBFFI_COMMIT}) |"
            echo "| Android NDK | ${NDK_VERSION} | Google release |"
            echo "| Android API level (minSdk) | ${ANDROID_API} (Android 11) | |"
            echo "| Architectures | $(IFS=', '; echo "${ALL_ABIS[*]}") | |"
            echo
            echo "LWJGL modules built: \`lwjgl\` (core, includes EGL bindings) and \`lwjgl-opengles\`."
            echo
            echo "## Downloads"
            echo
            echo "| ABI | Archive | Resource path |"
            echo "| --- | --- | --- |"
            for abi in "${ALL_ABIS[@]}"; do
              echo "| ${abi} | \`lwjgl-${LWJGL_VERSION}-android-${abi}.zip\` | \`linux/$(abi_lwjgl_arch "$abi")/org/lwjgl/\` |"
            done
            echo
            echo "Each archive contains the \`linux/<arch>/org/lwjgl/\` resource tree"
            echo "and can be extracted as-is into a Java project's resources."
            echo
            echo "Verify with \`SHA256SUMS.txt\` (attached)."
            echo
            echo "## Build configuration"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Compiler | Android NDK r29 clang (LLVM) |"
            echo "| Optimization | \`-O3\` |"
            echo "| Debug info | retained (DWARF), libraries are **not** stripped |"
            echo "| Linker version script | none - all symbols are exported |"
            echo "| Excluded sources | \`linux/UIO.c\`, \`linux/liburing/*\` (kernel-only) |"
            echo "| Runtime deps | \`libc\`, \`libdl\`, \`libm\` (bionic) only |"
            echo
            echo "<details><summary>Per-ABI build information</summary>"
            echo
            for f in artifacts/BUILD-INFO-*.txt; do
              echo '```text'
              cat "$f"
              echo '```'
              echo
            done
            echo "</details>"
            echo
            echo "## Not included"
            echo
            echo "ANGLE (\`libEGL_angle.so\`, \`libGLESv2_angle.so\`, \`libGLESv1_CM_angle.so\`) is **not**"
            echo "part of these archives: those are Android platform prebuilts and must be"
            echo "supplied separately under \`linux/<arch>/\`."
          } > release-notes.md

          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.LWJGL_VERSION }}
          name: ${{ env.LWJGL_VERSION }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/SHA256SUMS.txt
